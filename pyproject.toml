[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "s3-file-organizer"
version = "0.1.0"
description = "Builder utility for provisioning AWS S3 and automated file organization."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.0",
    "python-dotenv>=1.0.0",
    "urllib3>=2.0.0",
    "streamlit>=1.66.0",
]

# Setuptools configuration for the src-layout
[tool.setuptools.packages.find]
where = ["src"]

# Ruff Configuration (Linter and Formatter)
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"] # Linter rules (pycodestyle, pyflakes, isort)
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Pytest Configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]  
markers = [
    "integration: marks integration tests that depend on LocalStack",
]

# Mypy Configuration
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
