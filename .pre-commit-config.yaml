repos:
  - repo: local
    hooks:
      - id: run-pytest
        name: Run Unit Tests (pytest)
        entry: pytest -m "not integration"
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-lint
        name: Run Ruff Linter
        entry: ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: Run Ruff Formatter
        entry: ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
        