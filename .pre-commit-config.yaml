repos:
  # Ruff (Linter and Formatter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Mypy (Type checking for src-layout)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        pass_filenames: false
        additional_dependencies:
          - "boto3-stubs[s3]==1.43.66"

  # Local executions (Pytest e pip-audit)
  - repo: local
    hooks:
      - id: run-pytest
        name: Run Unit Tests (pytest)
        entry: pytest tests/unit
        language: system
        pass_filenames: false
        always_run: true

      - id: pip-audit
        name: Run Security Audit (pip-audit)
        entry: pip-audit
        language: system
        pass_filenames: false
        always_run: true
